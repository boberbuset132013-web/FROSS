build:
  command: ""
  system: docker
  min_cpu: 1
  max_cpu: 7
  min_memory: 5120
  max_memory: 10240
dockerfile_path: "services/python-brain/Dockerfile"
working_directory: "/"
build_context_directory: "/"
post_build_command: ""
scaling:
  min_cpu: 0.01
  max_cpu: 0.5
  min_memory: 128
  max_memory: 1024
  min_replicas: 1
  max_replicas: 1
health_check:
  type: http
  interval_in_seconds: 10
  http_path: /health
cron_jobs: []
workers: []
review_apps:
  enabled: false
  ttl_days: 7
