name: Python Transformer Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install ONNX test dependencies
        run: python -m pip install "onnx>=1.16,<2" "onnxruntime>=1.20,<2" numpy
      - name: Compile Python sources
        run: python -m compileall -q fross_transformer.py training/distillation tests
      - name: Validate and merge teacher corpus
        run: python training/distillation/prepare_corpus.py --base data/fross_corpus.jsonl --teacher data/fross_teacher_corpus.jsonl --output "$RUNNER_TEMP/fross-training-corpus.jsonl"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Parse PowerShell training launcher script
        shell: powershell
        run: |
          $path = Join-Path $PWD "training/windows/TRAIN_FROSS.ps1"
          $source = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::ASCII)
          $null = [scriptblock]::Create($source)
          Write-Host "TRAIN_FROSS.ps1 parsed successfully."
          if ($source -match "[^\x00-\x7F]") { throw "TRAIN_FROSS.ps1 must remain ASCII-only for Windows PowerShell 5.1." }
