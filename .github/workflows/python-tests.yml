name: Python Transformer Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install ONNX test dependencies
        run: python -m pip install "onnx>=1.16,<2" "onnxruntime>=1.20,<2" numpy
      - name: Compile Python sources
        run: python -m compileall -q fross_transformer.py training/distillation tests
      - name: Validate and merge teacher corpus
        run: python training/distillation/prepare_corpus.py --base data/fross_corpus.jsonl --teacher data/fross_teacher_corpus.jsonl --output "$RUNNER_TEMP/fross-training-corpus.jsonl"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
