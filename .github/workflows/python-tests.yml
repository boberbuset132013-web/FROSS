name: Python Transformer Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install tokenizer and ONNX test dependencies
        run: python -m pip install "onnx>=1.16,<2" "onnxruntime>=1.20,<2" numpy "sentencepiece>=0.2.0,<0.3"
      - name: Validate JavaScript and Wrangler configuration
        run: |
          node --input-type=module --check < worker.js
          python -c "import json; json.load(open('wrangler.jsonc', encoding='utf-8'))"
          python - <<'PY'
          import os, re
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, flags=re.DOTALL | re.IGNORECASE)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script; found {len(scripts)}")
          out = Path(os.environ["RUNNER_TEMP"]) / "fross-training-ui.js"
          out.write_text(scripts[0], encoding="utf-8")
          print(f"Extracted temporary UI script to {out}")
          PY
          node --check "$RUNNER_TEMP/fross-training-ui.js"
      - name: Compile Python sources
        run: python -m compileall -q fross_transformer.py training/distillation tests
      - name: Validate and merge teacher corpus
        run: python training/distillation/prepare_corpus.py --base data/fross_corpus.jsonl --teacher data/fross_teacher_corpus.jsonl --output "$RUNNER_TEMP/fross-training-corpus.jsonl"
      - name: Check the real training corpus reaches Brain 1.6 Unigram vocabulary target
        env:
          FROSS_DEVICE: cpu
        run: |
          python -c "import os, random; import fross_transformer as t; rows=t._load_corpus(os.path.join(os.environ['RUNNER_TEMP'], 'fross-training-corpus.jsonl')); random.seed(1337); random.shuffle(rows); count=max(2, int(len(rows)*0.1)); texts=[t._format_record(row) for row in rows[count:]]; tok=t.SentencePieceTokenizer.train(texts, target_vocab_size=8000); print('Actual Unigram vocabulary:', tok.vocab_size); assert tok.vocab_size == 8000, f'Vocabulary target not reached: {tok.vocab_size}/8000'"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Parse PowerShell training launcher script
        shell: powershell
        run: |
          $path = Join-Path $PWD "training/windows/TRAIN_FROSS.ps1"
          $source = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::ASCII)
          $null = [scriptblock]::Create($source)
          Write-Host "TRAIN_FROSS.ps1 parsed successfully."
          if ($source -match "[^\x00-\x7F]") { throw "TRAIN_FROSS.ps1 must remain ASCII-only for Windows PowerShell 5.1." }
