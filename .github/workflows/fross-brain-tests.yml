name: FROSS Brain checks

on:
  push:
    branches: [main]
    paths:
      - "fross-brain.js"
      - "worker.js"
      - "public/**"
      - "firestore.rules"
      - "SETUP.md"
      - "FROSS_CHARACTER.md"
      - "wrangler.jsonc"
      - "fross_brain_v05.py"
      - "services/**"
      - "render.yaml"
      - ".github/workflows/fross-brain-tests.yml"
  workflow_dispatch:

jobs:
  test-brains:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python brain and service adapters
        run: python -m py_compile fross_brain_v05.py services/python-brain/server.py services/cpp-brain/server.py
      - name: Run Python brain unit tests
        run: python fross_brain_v05.py
      - name: Compile C++ brain
        run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic services/cpp-brain/main.cpp -o /tmp/fross-cpp-brain
      - name: Check C++ greeting
        run: test "$(/tmp/fross-cpp-brain normal 'привет')" = "Привет! Я на связи. Что разберём?"
      - name: Check C++ arithmetic
        run: test "$(/tmp/fross-cpp-brain reasoning 'сколько будет (2+3)*4' | grep -o '20' | head -n 1)" = "20"
      - name: Check C++ code generation
        run: /tmp/fross-cpp-brain normal 'создай простейший код на Python' | grep -q 'def main'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript brain syntax
        run: node --input-type=module --check < fross-brain.js
      - name: Check Worker syntax
        run: node --input-type=module --check < worker.js
      - name: Check learning pipeline and message limits
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("worker.js").read_text(encoding="utf-8")
          page = Path("public/index.html").read_text(encoding="utf-8")
          rules = Path("firestore.rules").read_text(encoding="utf-8")
          wrangler = Path("wrangler.jsonc").read_text(encoding="utf-8")
          character = Path("FROSS_CHARACTER.md").read_text(encoding="utf-8")
          assert "const settled = await Promise.allSettled(tasks);" in worker
          assert "return collected.filter(note =>" in worker
          assert "Promise.all((Array.isArray(candidates) ? candidates : []).map(async item => {)).filter" not in worker
          assert "function frossTrainingSeedResources(topic)" in worker
          assert 'brainVersion: "0.6"' in worker
          assert "function frossComposeExplanation(query, notes, mode = \"normal\")" in Path("fross-brain.js").read_text(encoding="utf-8")
          assert "saveMemoryBtn" in page and "exportMemoryBtn" not in page
          assert "https://docs.python.org/3/tutorial/" in worker
          assert "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide" in worker
          assert 'path === "/api/auto-study"' in worker
          assert "async function handleFrossAutoStudy" in worker
          assert "frossMergeTrainingCandidates(topic, search.results, 8)" in worker
          assert "autoStudyBtn" in page
          assert "const FROSS_MAX_MESSAGE_LENGTH = 30000;" in worker
          assert "const FROSS_MAX_REPLY_LENGTH = 25000;" in worker
          assert "const history = frossLimitHistory(body.history);" in worker
          assert "function frossLimitHistory(history" in worker
          assert 'maxlength="30000"' in page
          assert "history=recentChatContext(activeMessages,5)" in page
          assert "request.resource.data.content.size() <= 30000" in rules
          assert "request.resource.data.content.size() <= 25000" in rules
          assert '"crons": ["0 3 * * *"]' in wrangler
          assert "25 000 символов" in character and "30 000 символов" in character
          print("Learning pipeline, scheduled study, history window and character limits passed.")
          PY
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          start = html.find('<script type="module">')
          if start < 0:
              raise SystemExit("Could not find the browser module script")
          start += len('<script type="module">')
          end = html.find("</script>", start)
          if end < 0:
              raise SystemExit("Could not find the closing script tag")
          Path("/tmp/fross-browser.mjs").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/fross-browser.mjs
      - name: Check structured knowledge retrieval priority
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const source = readFileSync("fross-brain.js", "utf8");
          const brain = await import("data:text/javascript;base64," + Buffer.from(source).toString("base64"));
          const knowledge = [{
            schemaVersion: 2,
            kind: "source-note",
            topic: "Основы Python",
            title: "Основы Python: переменные и функции",
            snippet: "Python хранит значения в переменных и позволяет объединять действия в функции.",
            summary: "Python хранит данные в переменных и использует функции для повторного использования кода.",
            keyPoints: ["Переменная хранит значение.", "Функция объединяет действия в отдельный блок."],
            keywords: ["python", "переменная", "функция", "синтаксис"],
            source: "test",
            score: 0.9,
            url: "https://example.test/python"
          }];
          const learned = brain.frossThink({ message: "Основы Python", knowledge });
          assert.equal(learned.kind, "saved-memory-v06");
          assert.match(learned.reply, /данные в переменных/);
          assert.match(learned.reply, /Объяснение простыми словами/);
          const explanation = learned.reply.split("Объяснение простыми словами:**")[1]?.split("\n\n")[0] || "";
          assert.ok((explanation.match(/[.!?](?:\s|$)/g) || []).length >= 2, "Brain 0.6 should connect multiple sentences from saved notes");
          const greeting = brain.frossThink({ message: "Привет", knowledge });
          assert.equal(greeting.kind, "local-rule-v05");
          const followup = brain.frossThink({
            message: "подробнее",
            history: [
              { role: "user", content: "Как создать сайт?" },
              { role: "assistant", content: "Сначала определи цель сайта. Затем создай HTML-разметку и добавь CSS-оформление." }
            ]
          });
          assert.match(followup.reply, /продолжу предыдущую мысль/i);
          assert.match(followup.reply, /HTML-разметку/i);
          const correction = brain.frossThink({ message: "не это" , history: [{ role: "assistant", content: "Предыдущий ответ." }] });
          assert.match(correction.reply, /неверно истолковал/i);
          const errorHelp = brain.frossThink({ message: "не работает" });
          assert.match(errorHelp.reply, /точный текст ошибки/i);
          const whyMath = brain.frossThink({
            message: "почему?",
            history: [
              { role: "user", content: "сколько будет (2+3)*4" },
              { role: "assistant", content: "Ответ: 20. Вычислено локально." }
            ]
          });
          assert.match(whyMath.reply, /Приоритет такой/i);
          console.log("Knowledge ranking, context-aware follow-ups, correction and error-help passed.");
          JS
