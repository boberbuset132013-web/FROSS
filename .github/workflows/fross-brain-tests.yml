name: FROSS Brain checks

on:
  pull_request:
    paths:
      - "fross-brain.js"
      - "worker.js"
      - "public/**"
      - "firestore.rules"
      - "SETUP.md"
      - "FROSS_CHARACTER.md"
      - "wrangler.jsonc"
      - "services/**"
      - "render.yaml"
      - "hostless.yaml"
      - "fross_transformer.py"
      - "data/**"
      - "tests/**"
      - ".github/workflows/fross-brain-tests.yml"
  push:
    branches: [main]
    paths:
      - "fross-brain.js"
      - "worker.js"
      - "public/**"
      - "firestore.rules"
      - "SETUP.md"
      - "FROSS_CHARACTER.md"
      - "wrangler.jsonc"
      - "services/**"
      - "render.yaml"
      - "hostless.yaml"
      - "fross_transformer.py"
      - "data/**"
      - "tests/**"
      - ".github/workflows/fross-brain-tests.yml"
  workflow_dispatch:

jobs:
  test-brains:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU training dependency
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
      - name: Validate Hostless Docker build paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          config = Path("hostless.yaml").read_text(encoding="utf-8")
          assert 'dockerfile_path: "services/python-brain/Dockerfile"' in config, "Hostless Dockerfile path must be relative to the repository root"
          assert 'working_directory: "/"' in config, "Hostless working directory must be the repository root"
          assert 'build_context_directory: "/"' in config, "Hostless build context must include repository-root files"
          dockerfile = Path("services/python-brain/Dockerfile").read_text(encoding="utf-8")
          copy_sources = []
          for raw_line in dockerfile.splitlines():
              line = raw_line.strip()
              if line.startswith("COPY "):
                  source = line.split()[1]
                  copy_sources.append(source)
                  assert Path(source).exists(), f"Docker COPY source is missing from repository root: {source}"
          assert copy_sources, "No COPY instructions found in the Python brain Dockerfile"
          print("Hostless root context and all Docker COPY source paths are valid.")
          PY
      - name: Compile Python Transformer and service adapter
        run: python -m py_compile fross_transformer.py services/python-brain/server.py tests/test_fross_transformer.py
      - name: Test original Transformer architecture and tokenizer
        run: python tests/test_fross_transformer.py
      - name: Train a scratch Transformer checkpoint and smoke-test generation
        run: python fross_transformer.py test --output /tmp/fross-transformer-test.pt --steps 12 --batch-size 2 --block-size 64 --merges 32 --text "Объясни attention простыми словами"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript brain syntax
        run: node --input-type=module --check < fross-brain.js
      - name: Check Worker syntax
        run: node --input-type=module --check < worker.js
      - name: Check learning pipeline and token-based chat limits
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          worker = Path("worker.js").read_text(encoding="utf-8")
          page = Path("public/index.html").read_text(encoding="utf-8")
          rules = Path("firestore.rules").read_text(encoding="utf-8")
          wrangler = Path("wrangler.jsonc").read_text(encoding="utf-8")
          character = Path("FROSS_CHARACTER.md").read_text(encoding="utf-8")
          assert "function frossLikelyConversationIntent(message)" in worker
          assert "как у тебя дела" in worker and "как у вас дела" in worker
          assert "const settled = await Promise.allSettled(tasks);" in worker
          assert "return collected.filter(note =>" in worker
          assert "Promise.all((Array.isArray(candidates) ? candidates : []).map(async item => {)).filter" not in worker
          assert "function frossTrainingSeedResources(topic)" in worker
          assert 'const FROSS_GITHUB_BRANCH = "fross-knowledge";' in worker, "Knowledge writes must stay off main so each study topic does not retrain the model"
          transformer = Path("fross_transformer.py").read_text(encoding="utf-8")
          assert 'brainVersion: "1.4"' in worker
          assert "class CausalSelfAttention" in transformer and "class FrossTransformer" in transformer
          assert "masked_fill(causal_mask" in transformer
          assert "trained_from_random_weights" in transformer
          assert "FROSS_LLM_API_KEY" not in worker and "openrouter" not in worker.lower()
          assert "function frossGenerateWithModel" not in worker
          assert "frossShouldSearchExplicit(correctedQuery)" in worker
          assert 'generationModel: "FROSS Transformer 1.4"' in worker
          assert not Path("services/llm_client.py").exists()
          assert "const selectedEndpoint = frossPythonBrainUrl(env);" in worker
          assert 'const FROSS_DEFAULT_PYTHON_BRAIN_URL = "https://fross-python-brain.hostless.app/chat";' in worker
          assert "const FROSS_MIN_BRAIN_TOKEN_LENGTH = 16;" in worker
          assert "function frossBrainServiceConfigured(env)" in worker
          assert "env.FROSS_CPP_BRAIN_URL" not in worker
          assert "async function frossProbePythonHealth" in worker and "pythonBrainHealth" in worker
          assert "ambient-orbs" in page and "orb-green" in page and "orb-violet" in page
          assert "orb-blue" in page and "orb-teal" in page
          assert "@keyframes fross-float-green" in page and "@keyframes fross-float-teal" in page
          assert "body.light-theme .composer" in page and "body.light-theme .auth-cover" in page
          assert "Это пополнение справочной базы, а не переобучение весов Transformer." in page
          assert "SpeechRecognition" in page and 'recognition.lang="ru-RU"' in page
          assert "Речь распознана. Проверь текст перед отправкой." in page
          brain_js = Path("fross-brain.js").read_text(encoding="utf-8")
          assert "export function frossCorrectText(text)" in brain_js
          assert "export function frossThink" not in brain_js
          assert "function quickReply" not in brain_js
          assert "frossQuickResponse" not in worker and "frossThink" not in worker
          assert 'id="publicStudySubmit"' in page and "exportMemoryBtn" not in page
          assert "https://docs.python.org/3/tutorial/" in worker
          assert "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide" in worker
          assert 'path === "/api/auto-study"' in worker
          assert "async function handleFrossAutoStudy" in worker
          assert "frossMergeTrainingCandidates(topic, search.results, 8)" in worker
          assert "autoStudyBtn" in page
          assert 'id="knowledgeBtn"' in page, "All signed-in users should see the shared knowledge button"
          assert "async function frossReserveAutoStudyStep" in worker, "Public knowledge steps must use a server-side reservation"
          assert "FROSS_AUTO_STUDY_COOLDOWN_MS = 2 * 60 * 1000" in worker, "Learning must allow a new topic every two minutes"
          curriculum = worker.split("const FROSS_AUTO_STUDY_CURRICULUM = [", 1)[1].split("];", 1)[0]
          corpus = Path("data/fross_corpus.jsonl").read_text(encoding="utf-8")
          assert "JavaScript: основы и типы данных" in curriculum and "Python: основы, условия и циклы" in curriculum, "Study plan must cover JavaScript and Python"
          assert "HTML: структура и семантические элементы" in curriculum and "CSS: Flexbox и Grid" in curriculum, "Study plan must cover HTML and CSS"
          assert "Понимание намерения пользователя" in curriculum and "Продолжение диалога и исправление недопонимания" in curriculum, "Study plan must teach user intent and dialogue repair"
          assert "Английский: письменные диалоги" in curriculum and "Китайский: иероглифы" in curriculum and "Русский: орфография" in curriculum, "Study plan must offer text-only language topics"
          assert "listening" not in curriculum.lower() and "аудио" not in curriculum.lower() and "слушание" not in curriculum.lower(), "Learning curriculum must not rely on audio"
          assert "Git и GitHub" not in curriculum and "C++" not in curriculum and "SQL" not in curriculum, "Programming curriculum must stay within JavaScript, Python, HTML and CSS"
          assert len([line for line in corpus.splitlines() if line.strip()]) >= 328, "Training corpus must include the new dialogue examples"
          assert "Как обучить модель понимать разные намерения пользователя?" in corpus and "Что делать, если модель повторяет приветствие после любого вопроса?" in corpus, "Corpus must cover intent understanding and incoherent replies"
          assert "Почему ты показываешь случайные ссылки не по вопросу?" in corpus and "Меняет ли автообучение каждые две минуты веса нейросети?" in corpus, "Corpus must cover irrelevant-source handling and the difference between notes and model training"
          assert 'id="publicStudyTopic"' in page and 'id="publicStudyForm"' in page, "Public topic search must be available"
          assert 'id="publicStudyLogs"' in page and 'id="publicStudyResults"' in page, "Study logs and results must be visible"
          assert 'id="settingsLearningBtn"' in page and 'settingsLearningBtn").addEventListener' in page, "Learning must be available from Settings"
          assert "FROSS_BROWSER_STUDY_NOTES_KEY" in page and "saveStudyNotesToMemory" in page, "Study results must be saved to account/browser memory"
          assert "function frossSteps(mode)" in worker and "1/14 — определить цель" in worker and "7/7 — проверить релевантность" in worker, "Worker must expose 7-stage normal and 14-stage reasoning workflows"
          assert "function frossShouldAutoLookup(query)" in worker and "function frossBuildUserLookupQuery(query)" in worker, "Unknown terms should be searched using the user's original words"
          assert "function frossForbiddenProgrammingTopic(topic)" in worker and "frossForbiddenProgrammingTopic(topic)" in worker, "Custom learning must reject programming languages outside JavaScript, Python, HTML and CSS"
          assert "...(shouldSearch ? results.slice(0, 6) : [])" in worker, "Fresh search results must be prioritized in the model context"
          assert 'VERSION = "FROSS Transformer 1.4"' in transformer and '"block_size": 320' in transformer and '"n_embd": 192' in transformer and '"n_head": 6' in transformer and '"n_layer": 6' in transformer, "Transformer version, context window and architecture must match Brain 1.4"
          assert 'def _response_strategy(message: str)' in transformer and "короткая социальная реплика" in transformer and "Тип запроса" in transformer, "Brain 1.4 must retain its task-type guidance templates"
          server = Path("services/python-brain/server.py").read_text(encoding="utf-8")
          assert 'FROSS Hybrid Transformer Brain 1.4' in server and 'max_new_tokens=request_token_limit' in server and 'requested_tokens' in server and '512' in server, "Python service must match Brain 1.4 and clamp per-request generation to a safe budget"
          assert "message-copy-btn" in page and "navigator.clipboard.writeText(original)" in page, "Assistant messages need a copy button"
          assert 'id="autoStudyStopBtn"' in page and "function startAutoStudy()" in page and "function stopAutoStudy()" in page, "Automatic learning must expose Start and Stop"
          assert "FROSS_AUTO_STUDY_STORAGE_KEY" in page and "resumeAutoStudySetting()" in page, "Automatic learning state should resume from browser storage"
          assert "FROSS_AUTO_STUDY_TOPICS" in page and "FROSS_AUTO_STUDY_INTERVAL_MS=120000" in page, "Automatic study must rotate topics at a two-minute interval"
          assert "hostCounts" in worker and "boilerplate" in worker and "frossMergeTrainingCandidates(unit.topic, searchResults, 7)" in worker, "Study notes should filter boilerplate and use diverse sources"
          assert "sourceText.trim().length < 45" in worker and 'String(note.snippet || "").trim().length >= 45' in worker, "Study notes must contain readable source text, not just links"
          assert "def _response_strategy(message: str)" in transformer and "Тип запроса: вопрос или объяснение" in transformer, "Brain 1.4 should retain task-type guidance text"
          assert "MAX_GENERATION_TOKENS = 5000" in transformer and "min(int(max_tokens), MAX_GENERATION_TOKENS)" in transformer, "Generation must support up to 5000 new tokens"
          assert "max_new_tokens=request_token_limit" in server and "requested_tokens" in server and "GENERATION_TOKEN_LIMIT" in server, "Python service must enforce the configured and per-request generation limits"
          dockerfile = Path("services/python-brain/Dockerfile").read_text(encoding="utf-8")
          assert "ARG FROSS_MODEL_URL=" in dockerfile and "ARG FROSS_REQUIRED_MODEL_STEPS=3000" in dockerfile and "ARG FROSS_VOCAB_SIZE=5000" in dockerfile and "FROSS_VOCAB_SIZE" in dockerfile and "uploaded-checkpoint" in dockerfile and "fross-model-source.txt" in dockerfile, "Docker build must download and verify a pre-trained checkpoint"
          assert "/app/fross_transformer.py train" not in dockerfile and "FROSS_TRAIN_STEPS" not in dockerfile and "FROSS_SKIP_MODEL_DOWNLOAD" not in dockerfile, "Hostless Docker builds must never train a model or silently fall back"
          knowledge_index = json.loads(Path("memory/knowledge/index.json").read_text(encoding="utf-8"))
          assert len(knowledge_index.get("topics", [])) >= 4, "Shared GitHub knowledge index should be initialized"
          assert Path("memory/knowledge/neural-networks.json").exists() and Path("memory/knowledge/javascript-basics.json").exists(), "Core public knowledge files should exist"
          assert "...(shouldSearch ? allKnowledge.slice(0, 18) : [])" in worker and "shouldSearch ? modelKnowledge : []" in worker, "Chat must not feed or show unrelated saved knowledge when no search is needed"
          assert "2 минуты" in page and "5 минут" not in page, "Learning panel must display the two-minute cadence"
          assert 'Я сегодня злой.' in corpus and 'значение слова «злой»' in corpus, "Corpus should cover contextual word meanings"
          assert "frossFallbackStudyInProgress" in worker and "fallbackMode: true" in worker, "Study must work when the GitHub secret is absent"
          assert "Стать создателем" not in page and 'id="creatorUnlockForm"' not in page, "Creator UI must be removed"
          assert 'path === "/api/creator-unlock"' not in worker and "handleFrossCreatorUnlock" not in worker, "Creator password endpoint must be removed"
          assert "FROSS_CREATOR_PASSWORD" not in worker and "frossIsCreator" not in worker and "FROSS_CREATOR_EMAIL" not in worker, "Creator role must be removed"
          assert "frossTrainingSearchQuery(cleanTopic)" in worker, "Visitor topics must be searched"
          assert 'const githubStorage = await frossSaveKnowledgeToGitHub(unit.topic, notes, env);' in worker, "Public study must save to the shared library"
          assert 'id="publicKnowledgeBtn"' in page, "Guests must see the no-login knowledge button"
          assert 'publicKnowledgeBtn").addEventListener' in page, "Guest knowledge button must be wired"
          auto_study = worker.split("async function handleFrossAutoStudy(request, env, ctx) {", 1)[1].split("async function handleFrossTrain(request, env) {", 1)[0]
          assert "frossVerifyFirebaseToken" not in auto_study, "Guest knowledge button must not require sign-in"
          assert "const FROSS_MAX_MESSAGE_LENGTH = 30000;" in worker
          assert "const FROSS_MAX_REPLY_LENGTH = 50000;" in worker
          assert "const history = frossLimitHistory(body.history);" in worker
          assert "function frossLimitHistory(history" in worker
          assert 'maxlength="30000"' in page
          assert "history=recentChatContext(activeMessages,5)" in page
          assert "const CHAT_TOKEN_LIMIT=1000000" in page and "estimateChatTokens" in page, "Chat storage should use a token-based limit rather than a message count"
          assert 'name.textContent=item.role==="user"?"Ты":"FROSS"' in page, "Assistant label should not expose model details"
          assert 'function showTyping(message="")' in page and '"Ищу в интернете"' in page and '"Составляю ответ"' in page, "Typing status should use concise user-facing phrases"
          assert "message.show-actions .message-actions" in page, "Clicking a message should reveal its copy action"
          assert "request.resource.data.tokenCount" in rules and "resource.data.userMessageCount < 60" not in rules, "Firestore must allow token-based chats without the old 60-message cutoff"
          assert "MAX_REPLY_CHARS = 50000" in server
assert 'path === "/api/model-upload"' in worker and "handleFrossModelUpload(request, env)" in worker, "Worker must proxy protected model uploads"
assert 'id="settingsModelUploadBtn"' in page and 'id="modelUploadForm"' in page, "Model upload must be available inside FROSS settings"
assert 'xhr.open("POST","/api/model-upload")' in page and "30*60*1000" in page, "Settings uploader must report progress and permit a 30-minute upload"
assert 'if self.path == "/admin/model-upload"' in server and "github_token=github_token" in server, "Python service must validate and save uploaded checkpoints using the forwarded server token"
assert '"X-FROSS-GITHUB-TOKEN": githubToken' in worker, "GitHub token must be forwarded only from Worker to Hostless, not browser-side"
          assert "request.resource.data.content.size() <= 50000" in rules
          assert "request.resource.data.content.size() <= 50000" in rules
          assert json.loads(wrangler).get("triggers", {}).get("crons") == ["0 3 * * *"]
          assert '"secrets"' in wrangler and '"FROSS_BRAIN_SERVICE_TOKEN"' in wrangler, "Worker deploy must require the Python brain token"
          assert "50 000 символов" in character and "30 000 символов" in character
          print("Learning pipeline, scheduled study, history window and character limits passed.")
          PY
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          start = html.find('<script type="module">')
          if start < 0:
              raise SystemExit("Could not find the browser module script")
          start += len('<script type="module">')
          end = html.find("</script>", start)
          if end < 0:
              raise SystemExit("Could not find the closing script tag")
          Path("/tmp/fross-browser.mjs").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/fross-browser.mjs
      - name: Check JavaScript has no canned-response brain
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const brainSource = readFileSync("fross-brain.js", "utf8");
          const workerSource = readFileSync("worker.js", "utf8");
          const brain = await import("data:text/javascript;base64," + Buffer.from(brainSource).toString("base64"));
          assert.equal(brain.frossCorrectText("Привте ФРОСС"), "Привет ФРОСС");
          assert.equal(typeof brain.frossThink, "undefined");
          assert.equal(typeof brain.frossQuickResponse, "undefined");
          assert.doesNotMatch(brainSource, /DEFINITIONS|function quickReply|export function frossThink/);
          assert.doesNotMatch(workerSource, /frossQuickResponse|frossThink|quickReply/);
          assert.match(workerSource, /generationModel: "FROSS Transformer 1.4"/);
          console.log("JavaScript brain only normalizes requests; replies must come from the trained Transformer.");
          JS
