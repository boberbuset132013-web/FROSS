name: FROSS Brain checks

on:
  push:
    branches: [main]
    paths:
      - "fross-brain.js"
      - "worker.js"
      - "public/**"
      - "firestore.rules"
      - "SETUP.md"
      - "FROSS_CHARACTER.md"
      - "wrangler.jsonc"
      - "fross_brain_v05.py"
      - "fross_neural_brain.py"
      - "services/**"
      - "render.yaml"
      - ".github/workflows/fross-brain-tests.yml"
  workflow_dispatch:

jobs:
  test-brains:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU training dependencies
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3"
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
      - name: Compile Python brain and service adapters
        run: python -m py_compile fross_brain_v05.py fross_neural_brain.py fross_transformer.py services/python-brain/server.py services/cpp-brain/server.py tests/test_fross_transformer.py
      - name: Run Python brain unit tests
        run: python fross_brain_v05.py
      - name: Train and test neural intent classifier
        run: python fross_neural_brain.py test --output /tmp/fross-neural-model.npz
      - name: Test original Transformer architecture and tokenizer
        run: python tests/test_fross_transformer.py
      - name: Train a scratch Transformer checkpoint and smoke-test generation
        run: python fross_transformer.py test --output /tmp/fross-transformer-test.pt --steps 12 --batch-size 2 --block-size 64 --merges 32 --text "Объясни attention простыми словами"
      - name: Compile C++ brain
        run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic services/cpp-brain/main.cpp -o /tmp/fross-cpp-brain
      - name: Check C++ conversational classification
        run: /tmp/fross-cpp-brain normal 'Привет' | grep -q '"intent":"conversation"'
      - name: Check C++ exact arithmetic candidate
        run: /tmp/fross-cpp-brain reasoning 'сколько будет (2+3)*4' | grep -q '"candidateResult":"20"'
      - name: Check C++ coding-task planning
        run: /tmp/fross-cpp-brain normal 'создай простейший код на Python' | grep -q '"intent":"code"'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript brain syntax
        run: node --input-type=module --check < fross-brain.js
      - name: Check Worker syntax
        run: node --input-type=module --check < worker.js
      - name: Check learning pipeline and message limits
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("worker.js").read_text(encoding="utf-8")
          page = Path("public/index.html").read_text(encoding="utf-8")
          rules = Path("firestore.rules").read_text(encoding="utf-8")
          wrangler = Path("wrangler.jsonc").read_text(encoding="utf-8")
          character = Path("FROSS_CHARACTER.md").read_text(encoding="utf-8")
          assert "function frossLikelyConversationIntent(message)" in worker
          assert "как у тебя дела" in worker and "как у вас дела" in worker
          assert "const settled = await Promise.allSettled(tasks);" in worker
          assert "return collected.filter(note =>" in worker
          assert "Promise.all((Array.isArray(candidates) ? candidates : []).map(async item => {)).filter" not in worker
          assert "function frossTrainingSeedResources(topic)" in worker
          transformer = Path("fross_transformer.py").read_text(encoding="utf-8")
          assert 'brainVersion: "1.0"' in worker
          assert "class CausalSelfAttention" in transformer and "class FrossTransformer" in transformer
          assert "masked_fill(causal_mask" in transformer
          assert "trained_from_random_weights" in transformer
          assert "FROSS_LLM_API_KEY" not in worker and "openrouter" not in worker.lower()
          assert "function frossGenerateWithModel" not in worker
          assert "frossShouldSearchExplicit(correctedQuery)" in worker
          assert 'generationModel: "FROSS Transformer 1.0"' in worker
          assert not Path("services/llm_client.py").exists()
          assert "SpeechRecognition" in page and 'recognition.lang="ru-RU"' in page
          assert "Речь распознана. Проверь текст перед отправкой." in page
          brain_js = Path("fross-brain.js").read_text(encoding="utf-8")
          assert "export function frossCorrectText(text)" in brain_js
          assert "export function frossThink" not in brain_js
          assert "function quickReply" not in brain_js
          assert "frossQuickResponse" not in worker and "frossThink" not in worker
          assert "saveMemoryBtn" in page and "exportMemoryBtn" not in page
          assert "https://docs.python.org/3/tutorial/" in worker
          assert "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide" in worker
          assert 'path === "/api/auto-study"' in worker
          assert "async function handleFrossAutoStudy" in worker
          assert "frossMergeTrainingCandidates(topic, search.results, 8)" in worker
          assert "autoStudyBtn" in page
          assert "const FROSS_MAX_MESSAGE_LENGTH = 30000;" in worker
          assert "const FROSS_MAX_REPLY_LENGTH = 25000;" in worker
          assert "const history = frossLimitHistory(body.history);" in worker
          assert "function frossLimitHistory(history" in worker
          assert 'maxlength="30000"' in page
          assert "history=recentChatContext(activeMessages,5)" in page
          assert "request.resource.data.content.size() <= 30000" in rules
          assert "request.resource.data.content.size() <= 25000" in rules
          assert '"crons": ["0 3 * * *"]' in wrangler
          assert "25 000 символов" in character and "30 000 символов" in character
          print("Learning pipeline, scheduled study, history window and character limits passed.")
          PY
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          start = html.find('<script type="module">')
          if start < 0:
              raise SystemExit("Could not find the browser module script")
          start += len('<script type="module">')
          end = html.find("</script>", start)
          if end < 0:
              raise SystemExit("Could not find the closing script tag")
          Path("/tmp/fross-browser.mjs").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/fross-browser.mjs
      - name: Check JavaScript has no canned-response brain
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const brainSource = readFileSync("fross-brain.js", "utf8");
          const workerSource = readFileSync("worker.js", "utf8");
          const brain = await import("data:text/javascript;base64," + Buffer.from(brainSource).toString("base64"));
          assert.equal(brain.frossCorrectText("Привте ФРОСС"), "привет фросс");
          assert.equal(typeof brain.frossThink, "undefined");
          assert.equal(typeof brain.frossQuickResponse, "undefined");
          assert.doesNotMatch(brainSource, /DEFINITIONS|function quickReply|export function frossThink/);
          assert.doesNotMatch(workerSource, /frossQuickResponse|frossThink|quickReply/);
          assert.match(workerSource, /generationModel: "FROSS Transformer 1.0"/);
          console.log("JavaScript brain only normalizes requests; replies must come from the trained Transformer.");
          JS
